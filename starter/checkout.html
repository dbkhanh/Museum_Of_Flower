<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="/static/imgs/pp.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/app.css">
    <title>Checkout - Museum of Flowers</title>
</head>
<body>
    <nav id="mainNavbar" class="navbar navbar-dark navbar-expand-md py-0 fixed-top">
        <a href="/static/home.html" class="navbar-brand">FLOWER</a>
        <button class="navbar-toggler" data-toggle="collapse" data-target="#navLinks" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navLinks">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a href="/static/home.html" class="nav-link">HOME</a>
                </li>
                <li class="nav-item">
                    <a href="/static/about.html" class="nav-link">ABOUT</a>
                </li>
                <li class="nav-item">
                    <a href="/static/tickets.html" class="nav-link">TICKETS</a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a href="#" id="basket-icon" class="nav-link d-flex align-items-center" title="View basket">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                        <span id="basket-count" class="badge badge-pill badge-danger ml-1" style="display: none;">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div id="basket-modal" class="basket-modal" style="display: none;">
        <div class="basket-modal-content">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Your Basket</h5>
                <button id="basket-modal-close" class="btn btn-sm btn-outline-secondary">&times;</button>
            </div>
            <div id="basket-modal-body"></div>
        </div>
    </div>

    <section class="container content" style="margin-top: 100px;">
        <div class="row justify-content-center">
            <div class="col-12 text-center mb-4">
                <h1 style="color: #EA1C2C; font-weight: 100;">CHECKOUT</h1>
                <p class="lead" style="color: #f68282; font-weight: 100;">Review your order and complete your purchase.</p>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div id="checkout-content" class="card p-4">
                    <p class="text-muted text-center">Loading your order...</p>
                </div>
                <div id="empty-basket" class="card p-4 text-center" style="display: none;">
                    <p class="text-muted mb-3">Your basket is empty.</p>
                    <a href="/static/tickets.html" class="btn btn-primary">Browse Tickets</a>
                </div>
            </div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    <script src="/static/basket.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initBasketIcon();
            const basketId = localStorage.getItem('museum_basket_id');
            const checkoutContent = document.getElementById('checkout-content');
            const emptyBasket = document.getElementById('empty-basket');

            if (!basketId) {
                checkoutContent.style.display = 'none';
                emptyBasket.style.display = 'block';
                return;
            }

            Promise.all([
                fetch('/baskets/' + basketId).then(r => r.ok ? r.json() : null),
                fetch('/baskets/' + basketId + '/tickets').then(r => r.ok ? r.json() : [])
            ]).then(([basket, tickets]) => {
                if (!basket || !Array.isArray(tickets) || tickets.length === 0) {
                    checkoutContent.style.display = 'none';
                    emptyBasket.style.display = 'block';
                    return;
                }

                const ticketGroups = {};
                tickets.forEach(t => {
                    const key = t.type + ' - ' + t.subtype;
                    if (!ticketGroups[key]) ticketGroups[key] = { count: 0, price: parseFloat(t.price), ticketIds: [] };
                    ticketGroups[key].count++;
                    ticketGroups[key].ticketIds.push(t.ticket_id);
                });

                let html = '<h5 class="mb-4">Order Summary</h5>';
                let total = 0;
                for (const [name, info] of Object.entries(ticketGroups)) {
                    const subtotal = info.count * info.price;
                    total += subtotal;
                    const removeBtn = info.count > 0 ? ' <button type="button" class="btn btn-sm btn-outline-danger remove-ticket" data-ticket-id="' + info.ticketIds[0] + '" title="Remove one">×</button>' : '';
                    html += '<div class="d-flex justify-content-between py-2 border-bottom"><span>' + name + ' × ' + info.count + removeBtn + '</span><span>$' + subtotal.toFixed(2) + '</span></div>';
                }
                html += '<div class="d-flex justify-content-between py-3 mt-2 font-weight-bold"><span>Total (' + basket.total_tickets + ' tickets)</span><span>$' + total.toFixed(2) + '</span></div>';
                html += '<button id="confirm-checkout" class="btn btn-primary btn-block mt-3">Confirm Purchase</button>';
                checkoutContent.innerHTML = html;

                checkoutContent.querySelectorAll('.remove-ticket').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const ticketId = this.getAttribute('data-ticket-id');
                        if (!ticketId) return;
                        const res = await fetch('/tickets/' + ticketId, { method: 'DELETE' });
                        if (res.ok) {
                            if (typeof updateBasketBadge === 'function') updateBasketBadge();
                            location.reload();
                        }
                    });
                });

                document.getElementById('confirm-checkout').addEventListener('click', async function() {
                    this.disabled = true;
                    this.textContent = 'Processing...';
                    const purchaseSummary = { ticketGroups: ticketGroups, total: total, ticketCount: basket.total_tickets };
                    const res = await fetch('/baskets/' + basketId + '/checkout', { method: 'POST' });
                    if (res.ok) {
                        if (typeof updateBasketBadge === 'function') updateBasketBadge();
                        let thankYouHtml = '<h5 class="text-success mb-4">Thank you for your purchase!</h5>';
                        thankYouHtml += '<h6 class="mb-3">Your purchased items:</h6>';
                        thankYouHtml += '<div class="list-group mb-4">';
                        for (const [name, info] of Object.entries(purchaseSummary.ticketGroups)) {
                            const subtotal = info.count * info.price;
                            thankYouHtml += '<div class="d-flex justify-content-between py-2 border-bottom"><span>' + name + ' × ' + info.count + '</span><span>$' + subtotal.toFixed(2) + '</span></div>';
                        }
                        thankYouHtml += '</div>';
                        thankYouHtml += '<div class="d-flex justify-content-between py-3 font-weight-bold"><span>Total (' + purchaseSummary.ticketCount + ' tickets)</span><span>$' + purchaseSummary.total.toFixed(2) + '</span></div>';
                        thankYouHtml += '<a href="/static/tickets.html" class="btn btn-primary mt-3">Browse More Tickets</a>';
                        checkoutContent.innerHTML = thankYouHtml;
                    } else {
                        this.disabled = false;
                        this.textContent = 'Confirm Purchase';
                        alert('Something went wrong. Please try again.');
                    }
                });
            }).catch(() => {
                checkoutContent.innerHTML = '<p class="text-danger">Unable to load your order. Please try again.</p>';
            });
        });
    </script>
</body>
</html>
